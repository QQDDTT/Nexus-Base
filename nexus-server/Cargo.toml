[package]
name = "nexus-server"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
tonic = { version = "0.11", features = ["transport"] }
tracing = "0.1"
tracing-subscriber = "0.3"
nexus-core = { path = "../nexus-core" }
nexus-proto = { path = "../nexus-proto" }
ed25519-dalek = "2"
hex = "0.4"

[dev-dependencies]
tempfile = "3.8"

