[package]
name = "nexus-test"
version = "0.1.0"
edition = "2021"

[dependencies]
nexus-core = { path = "../core" }
server = { path = "../server" }
nexus-proto = { path = "../proto" }
tokio = { version = "1.0", features = ["full", "rt-multi-thread", "macros"] }
tempfile = "3.8"
tonic = "0.11"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
hex = "0.4"
mcp-adapter = { path = "../mcp-adapter" }
serde_json = "1.0"

[[bin]]
name = "perf_bench"
path = "src/bin/perf_bench.rs"

