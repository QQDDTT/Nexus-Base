[package]
name = "mcp-adapter"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "nexus-mcp"
path = "src/main.rs"

[lib]
name = "mcp_adapter"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tonic = "0.11"
nexus-proto = { path = "../proto" }
uuid = { version = "1.8", features = ["v4", "fast-rng"] }
